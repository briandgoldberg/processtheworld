<title>Process the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a working studio. Library of maps → workspace with conversation on the left and a swim-lane board on the right; lanes split into People and Technology bands. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#141C27; --muted:#5A6573; --line:#D7DDE5;
  --accent:#2448C9; --accent-ink:#FFFFFF; --accent-soft:#E6ECFC;
  --person:#A86A12; --person-bg:#FBF3E6; --system:#0D7672; --system-bg:#E5F3F2;
  --edge:#8592A3; --fresh:#2448C9; --danger:#B42318; --ok:#1E7B47;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E28; --sunk:#1F2834; --ink:#E7ECF2; --muted:#98A3B2; --line:#2C3746;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2A4D;
  --person:#E3A548; --person-bg:#2A2216; --system:#4CC2BC; --system-bg:#14292A;
  --edge:#6B788A; --fresh:#7C9BFF; --danger:#FF7A6E; --ok:#5BD08F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E28; --sunk:#1F2834; --ink:#E7ECF2; --muted:#98A3B2; --line:#2C3746;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2A4D;
  --person:#E3A548; --person-bg:#2A2216; --system:#4CC2BC; --system-bg:#14292A;
  --edge:#6B788A; --fresh:#7C9BFF; --danger:#FF7A6E; --ok:#5BD08F; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pub{color:var(--system);border-color:color-mix(in srgb,var(--system) 40%,transparent)}
.pill.ex{color:var(--person);border-color:color-mix(in srgb,var(--person) 40%,transparent)}

/* Login */
.login{flex:1;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.login-card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:22px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.mark i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.login h1{font-size:clamp(30px,6vw,44px);line-height:1.08}
.login p{color:var(--muted);margin:0;max-width:46ch;font-size:15px}
.lanes-demo{display:grid;gap:6px}
.lanes-demo div{display:flex;align-items:center;gap:10px;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.lanes-demo .p{background:var(--person-bg);color:var(--person)}
.lanes-demo .s{background:var(--system-bg);color:var(--system)}
.lanes-demo span{color:var(--ink);font-weight:500;opacity:.8}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.title-in{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-family:var(--f-display);font-weight:700;font-size:18px;width:100%;min-width:0}
.title-in:hover,.title-in:focus{border-color:var(--line);background:var(--bg)}
.save{color:var(--muted);font-size:12px}

/* Home */
.home{flex:1;overflow:auto;padding-inline:16px;padding-block:28px}
.home-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-head h1{font-size:30px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:18px}
.sec-head p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16px}
.card .meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.spark{display:flex;gap:3px;height:6px}
.spark b{flex:1;border-radius:2px;background:var(--person)}
.spark b.s{background:var(--system)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Workspace */
.work{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);min-height:0;min-width:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:12px;padding:9px 12px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg.note{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;padding:2px}
.msg .ask{display:block;margin-top:6px;font-weight:600}
.msg .ops{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.msg.err{color:var(--danger)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.starters{display:flex;flex-direction:column;gap:8px}
.starter{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;text-align:left}
.starter:hover{border-color:var(--accent)}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-height:72px;max-height:180px}
.composer-row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}

.canvas-wrap{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.crumbs{display:flex;align-items:center;gap:6px;padding-inline:16px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{border:none;background:none;padding:3px 6px;border-radius:6px;font-weight:600;color:var(--muted)}
.crumb:hover{background:var(--sunk);color:var(--ink)}
.crumb.cur{color:var(--ink);cursor:default}
.crumbs .sep{color:var(--line)}
.crumbs .spacer{flex:1}
.depth{display:inline-flex;gap:3px;align-items:center}
.depth b{width:14px;height:5px;border-radius:2px;background:var(--line)}
.depth b.on{background:var(--accent)}
.signal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scroller{flex:1;overflow:auto;min-height:0}
.board{position:relative}
.lane{position:absolute;left:0;display:flex;border-bottom:1px solid var(--line)}
.lane-head{width:150px;flex:none;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.lane-head b{font-size:13px;line-height:1.25}
.lane-head small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lane.person .lane-head{background:var(--person-bg)}
.lane.person .lane-head small{color:var(--person)}
.lane.system .lane-head{background:var(--system-bg)}
.lane.system .lane-head small{color:var(--system)}
.lane.system{background:color-mix(in srgb,var(--system-bg) 45%,transparent)}
.band{position:absolute;left:0;height:22px;display:flex;align-items:center;padding-inline:12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--edge);stroke-width:1.5}
.elabel{position:absolute;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:0 4px;border-radius:4px;transform:translate(-50%,-50%);pointer-events:none}
.step{position:absolute;width:158px;min-height:60px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:left;font-size:13px;line-height:1.3;font-weight:500}
.step:hover{border-color:var(--muted)}
.step.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step.start,.step.end{border-radius:30px;text-align:center;align-items:center;font-weight:600}
.step.end{border-width:3px;border-style:double}
.step.decision{border-style:dashed}
.step.decision .k{color:var(--accent)}
.step.subprocess{box-shadow:4px 4px 0 -1.5px var(--surface),4px 4px 0 0 var(--line)}
.step.subprocess.sel{box-shadow:0 0 0 3px var(--accent-soft),4px 4px 0 -1.5px var(--surface),4px 4px 0 0 var(--accent)}
.step .k{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.02em}
.step .uses{display:flex;gap:4px;flex-wrap:wrap}
.step .uses span{font-size:10px;font-weight:600;color:var(--system);background:var(--system-bg);border-radius:4px;padding:0 5px}
.step .open{align-self:flex-start;border:none;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}
.step.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{border-color:var(--fresh);box-shadow:0 0 0 6px var(--accent-soft)}100%{}}
.board-empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.board-empty div{max-width:380px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.board-empty h3{color:var(--ink);font-size:20px}

.inspector{position:absolute;right:12px;top:58px;width:290px;max-width:calc(100% - 24px);max-height:calc(100% - 70px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -12px rgba(10,20,40,.35);padding:14px;display:flex;flex-direction:column;gap:12px;z-index:5}
.inspector .row{display:flex;flex-direction:column;gap:4px}
.inspector input,.inspector select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%}
.inspector .acts{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ins-head{display:flex;justify-content:space-between;align-items:center}
.hint{color:var(--muted);font-size:12px;margin:0}

.tabs{display:none}
@media (max-width:820px){
  .work{grid-template-columns:1fr}
  .tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px;font-weight:600}
  .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .work[data-tab="chat"] .canvas-wrap{display:none}
  .work[data-tab="map"] .chat{display:none}
  .chat{border-right:none}
}
@media (prefers-reduced-motion: reduce){.step.fresh,.thinking i{animation:none}}
</style>

<div id="app"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = p => p + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const KINDS = ['start','task','decision','subprocess','end'];
const ss = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch {} } };

/* ---------- Example processes (shown as examples, read-only until you change them) ---------- */
const st = (id,lane,label,kind,next=[],extra={}) => ({id,lane,label,kind,uses:[],next:next.map(n=>typeof n==='string'?{to:n}:{to:n[0],label:n[1]}),...extra});
const EX_EGG = {
  id:'ex_egg', example:true, visibility:'public', title:'Fry an egg', updatedAt:0,
  maps:{
    m_root:{ id:'m_root', title:'Fry an egg', parent:null,
      lanes:[{id:'e_cook',name:'Cook',type:'person'},{id:'e_stove',name:'Stove',type:'system'}],
      steps:[
        st('f1','e_cook','Want a fried egg','start',['f2']),
        st('f2','e_cook','Prepare the pan','subprocess',['f3'],{child:'m_f2'}),
        st('f3','e_cook','Crack the egg','subprocess',['f4'],{child:'m_f3'}),
        st('f4','e_stove','Cook until whites set','task',['f5']),
        st('f5','e_cook','Over easy?','decision',[['f6','Yes'],['f7','No']]),
        st('f6','e_cook','Flip gently','task',['f7'],{uses:[]}),
        st('f7','e_cook','Slide onto a plate','task',['f8']),
        st('f8','e_cook','Turn off the burner','task',['f9'],{uses:['e_stove']}),
        st('f9','e_cook','Eat','end')
      ]},
    m_f2:{ id:'m_f2', title:'Prepare the pan', parent:{map:'m_root',step:'f2'},
      lanes:[{id:'g_cook',name:'Cook',type:'person'},{id:'g_stove',name:'Stove',type:'system'}],
      steps:[
        st('g1','g_cook','Put pan on burner','start',['g2']),
        st('g2','g_cook','Set heat to medium','task',['g3'],{uses:['g_stove']}),
        st('g3','g_stove','Heat the pan','task',['g4']),
        st('g4','g_cook','Add butter or oil','task',['g5']),
        st('g5','g_cook','Butter sizzling?','decision',[['g6','Yes'],['g3','No']]),
        st('g6','g_cook','Pan ready','end')
      ]},
    m_f3:{ id:'m_f3', title:'Crack the egg', parent:{map:'m_root',step:'f3'},
      lanes:[{id:'c_cook',name:'Cook',type:'person'}],
      steps:[
        st('c1','c_cook','Pick up an egg','start',['c2']),
        st('c2','c_cook','Tap on a flat surface','task',['c3']),
        st('c3','c_cook','Open shell over the pan','task',['c4']),
        st('c4','c_cook','Shell in the pan?','decision',[['c5','Yes'],['c6','No']]),
        st('c5','c_cook','Fish out the shell','subprocess',['c6'],{child:'m_c5'}),
        st('c6','c_cook','Egg in the pan','end')
      ]},
    m_c5:{ id:'m_c5', title:'Fish out the shell', parent:{map:'m_f3',step:'c5'},
      lanes:[{id:'k_cook',name:'Cook',type:'person'}],
      steps:[
        st('k1','k_cook','Spot a shell piece','start',['k2']),
        st('k2','k_cook','Scoop it with a shell half','task',['k3']),
        st('k3','k_cook','Got it all?','decision',[['k4','Yes'],['k2','No']]),
        st('k4','k_cook','Shell removed','end')
      ]}
  },
  chat:[
    {role:'user',content:'How I fry an egg. First I get the pan ready, then I crack the egg in.'},
    {role:'assistant',content:'Added you as the cook, the stove, and two subprocesses: "Prepare the pan" and "Crack the egg".',ask:'How do you know the pan is hot enough?'},
    {role:'user',content:'When the butter sizzles. And if a bit of shell falls in, I scoop it out with the other half of the shell.'},
    {role:'assistant',content:'Added the sizzle check inside "Prepare the pan", and a "Fish out the shell" layer inside "Crack the egg".',ask:'Do you flip it, or cook it sunny side up?'}
  ],
  events:[]
};
const EX_CAR = {
  id:'ex_car', example:true, visibility:'public', title:'Start a car', updatedAt:0,
  maps:{ m_root:{ id:'m_root', title:'Start a car', parent:null,
    lanes:[{id:'d_drv',name:'Driver',type:'person'},{id:'d_key',name:'Key or key fob',type:'system'},{id:'d_car',name:'Car',type:'system'}],
    steps:[
      st('d1','d_drv','Sit in the driver’s seat','start',['d2']),
      st('d2','d_drv','Press the brake pedal','task',['d3']),
      st('d3','d_drv','Push-button start?','decision',[['d4','Yes'],['d5','No']]),
      st('d4','d_drv','Press Start','task',['d6'],{uses:['d_car']}),
      st('d6','d_car','Detect the key fob','task',['d7'],{uses:['d_key']}),
      st('d5','d_drv','Turn the key','task',['d7'],{uses:['d_key']}),
      st('d7','d_car','Crank the engine','task',['d8']),
      st('d8','d_drv','Engine running?','decision',[['d9','Yes'],['d2','No']]),
      st('d9','d_drv','Check dashboard lights','task',['d10']),
      st('d10','d_drv','Ready to drive','end')
    ]}},
  chat:[], events:[]
};
const EX_TEA = {
  id:'ex_tea', example:true, visibility:'public', title:'Make a cup of tea', updatedAt:0,
  maps:{ m_root:{ id:'m_root', title:'Make a cup of tea', parent:null,
    lanes:[{id:'t_me',name:'Tea maker',type:'person'},{id:'t_kettle',name:'Kettle',type:'system'}],
    steps:[
      st('t1','t_me','Want tea','start',['t2']),
      st('t2','t_me','Fill and switch on kettle','task',['t3','t4'],{uses:['t_kettle']}),
      st('t3','t_kettle','Boil and click off','task',['t5']),
      st('t4','t_me','Tea bag in the mug','task',['t5']),
      st('t5','t_me','Pour the water','task',['t6']),
      st('t6','t_me','Steep 3–5 minutes','task',['t7']),
      st('t7','t_me','Milk or sugar?','decision',[['t8','Yes'],['t9','No']]),
      st('t8','t_me','Add and stir','task',['t9']),
      st('t9','t_me','Drink','end')
    ]}},
  chat:[], events:[]
};
const EXAMPLES = [EX_EGG, EX_CAR, EX_TEA];

/* ---------- State ---------- */
const S = { view:'login', uid:null, name:'', db:null, sample:null, ready:false,
  mine:[], pub:[], local:[], cur:null, path:['m_root'], sel:null, busy:false, ctl:null,
  fresh:new Set(), save:'', tab:'chat', confirmPublic:false, deep:false };

/* ---------- Helpers on the process model ---------- */
function newProcess(){
  const id = rid('p');
  return { id, title:'Untitled process', visibility:'private', ownerId:S.uid, updatedAt:Date.now(),
    maps:{ m_root:{ id:'m_root', title:'Untitled process', parent:null, lanes:[], steps:[] } }, chat:[], events:[] };
}
const curMap = () => S.cur?.maps[S.path[S.path.length-1]] || S.cur?.maps.m_root;
function stats(p){
  const maps = Object.values(p.maps || {});
  let steps = 0; maps.forEach(m => steps += m.steps.length);
  const depthOf = m => { let d = 1, x = m; while (x?.parent && d < 20) { x = p.maps[x.parent.map]; d++; } return d; };
  const depth = maps.reduce((a,m)=>Math.max(a,depthOf(m)),1);
  const lanes = (p.maps?.m_root?.lanes || []);
  return { steps, depth, lanes };
}
function countSteps(p, mapId, seen = new Set()){
  const m = p.maps[mapId]; if (!m || seen.has(mapId)) return 0; seen.add(mapId);
  return m.steps.reduce((a,s)=> a + 1 + (s.child ? countSteps(p, s.child, seen) : 0), 0);
}
const normType = t => /sys|tech|tool|app|soft|platform/i.test(String(t||'')) ? 'system' : 'person';
function logEvent(p, e){ p.events = p.events || []; p.events.push({ t:Date.now(), ...e }); if (p.events.length > 300) p.events.splice(0, p.events.length - 300); }

/* Make an example (or someone else's private view) your own before changing it */
function ensureOwned(){
  const p = S.cur; if (!p?.example) return;
  const copy = clone(p); delete copy.example;
  copy.id = rid('p'); copy.visibility = 'private'; copy.ownerId = S.uid; copy.events = [];
  copy.chat.push({ role:'note', content:'Saved your own private copy of this example.' });
  S.cur = copy;
}

/* ---------- Apply one AI or human change ---------- */
function setStepFields(s, o){
  if ('label' in o && o.label) s.label = String(o.label);
  if (o.lane) s.lane = String(o.lane);
  if (o.kind && KINDS.includes(o.kind)) s.kind = o.kind;
  if (Array.isArray(o.uses)) s.uses = o.uses.map(String);
}
function removeMapTree(p, mapId){
  const m = p.maps[mapId]; if (!m || mapId === 'm_root') return;
  m.steps.forEach(s => s.child && removeMapTree(p, s.child));
  delete p.maps[mapId];
}
function applyOp(p, o, who){
  if (!o || typeof o !== 'object') return null;
  const m = o.map ? p.maps[o.map] : null;
  const find = (mm, id) => mm?.steps.find(s => s.id === String(id));
  let touched = null;
  switch (o.op){
    case 'rename_process':
      if (o.title){ p.title = String(o.title); p.maps.m_root.title = p.title; touched = 'title'; } break;
    case 'rename_map':
      if (m && o.title){ m.title = String(o.title); if (m.id === 'm_root') p.title = m.title; touched = 'title'; } break;
    case 'add_lane': case 'update_lane': {
      if (!m || !o.id) break;
      let l = m.lanes.find(l => l.id === String(o.id));
      if (l){ if (o.name) l.name = String(o.name); if (o.type) l.type = normType(o.type); }
      else if (o.op === 'add_lane') m.lanes.push({ id:String(o.id), name:String(o.name || 'New lane'), type:normType(o.type) });
      touched = String(o.id); break; }
    case 'remove_lane':
      if (!m) break;
      m.lanes = m.lanes.filter(l => l.id !== String(o.id));
      m.steps.forEach(s => { if (s.lane === String(o.id)) s.lane = null; s.uses = (s.uses||[]).filter(u => u !== String(o.id)); });
      touched = String(o.id); break;
    case 'add_step': case 'update_step': {
      if (!m || !o.id) break;
      let s = find(m, o.id);
      if (!s){ if (o.op === 'update_step') break; s = { id:String(o.id), lane:null, label:'New step', kind:'task', uses:[], next:[] }; m.steps.push(s); }
      setStepFields(s, o);
      if (o.after){ const a = find(m, o.after); if (a && a !== s && !a.next.some(n => n.to === s.id)) a.next.push({ to:s.id, label:o.after_label ? String(o.after_label) : '' }); }
      touched = s.id; break; }
    case 'remove_step': {
      const s = find(m, o.id); if (!s) break;
      if (s.child) removeMapTree(p, s.child);
      m.steps = m.steps.filter(x => x !== s);
      m.steps.forEach(x => x.next = x.next.filter(n => n.to !== s.id));
      touched = s.id; break; }
    case 'connect': {
      const a = find(m, o.from), b = find(m, o.to); if (!a || !b || a === b) break;
      const ex = a.next.find(n => n.to === b.id);
      if (ex){ if (o.label) ex.label = String(o.label); } else a.next.push({ to:b.id, label:o.label ? String(o.label) : '' });
      touched = b.id; break; }
    case 'disconnect': {
      const a = find(m, o.from); if (!a) break;
      a.next = a.next.filter(n => n.to !== String(o.to)); touched = a.id; break; }
    case 'add_map': {
      const parent = p.maps[o.parent_map], st = find(parent, o.parent_step);
      if (!st || !o.id) break;
      const id = String(o.id);
      if (!p.maps[id]) p.maps[id] = { id, title:String(o.title || st.label), parent:{ map:parent.id, step:st.id }, lanes:[], steps:[] };
      st.kind = 'subprocess'; st.child = id; touched = st.id; break; }
  }
  if (touched){
    S.fresh.add(touched);
    logEvent(p, { who, op:o.op, map:o.map || o.parent_map || null, id:o.id || o.from || null });
  }
  return touched;
}

/* ---------- Prompt for live mapping ---------- */
const RULES = `You are the mapping engine of a process-mapping studio. A person describes a process conversationally and you update a structured swim-lane process model as they talk. You also act as a good interviewer: after each change you ask the single most useful follow-up question.

MODEL
- A process is a tree of maps. "m_root" is the top level. Any step can be a subprocess whose detail lives in its own child map, which can contain subprocesses of its own (drill-down layers).
- Each map has lanes and steps.
  - Lane types: "person" (a role or type of user, e.g. "Cook", "Driver", "Parent"; use roles, not personal names unless the user gives them) and "system" (technology: apps, tools, databases, devices).
  - Step kinds: start, task, decision, subprocess, end. Every step sits in exactly one lane.
  - A person doing something in a tool: put the step in the person's lane and list the tool lane in "uses". Put a step in a system lane only when the technology acts on its own (sends, stores, calculates, triggers).
  - Decisions have one outgoing connection per outcome, each labeled ("Yes"/"No" or the real outcomes).
- Ids must be unique across the WHOLE process. Lanes: l1, l2...; steps: s1, s2...; child maps: m_<stepId>. Never reuse an existing id for something new; check the current model.

CHANGES — reply with ONLY JSON objects, exactly one per line, no code fences, no prose:
{"op":"rename_process","title":"..."}
{"op":"rename_map","map":"m_x","title":"..."}
{"op":"add_lane","map":"m_root","id":"l1","name":"Cook","type":"person"}
{"op":"update_lane","map":"m_root","id":"l1","name":"...","type":"system"}
{"op":"remove_lane","map":"m_root","id":"l1"}
{"op":"add_step","map":"m_root","id":"s1","lane":"l1","label":"Short verb phrase","kind":"task","uses":["l3"],"after":"s0","after_label":""}
{"op":"update_step","map":"m_root","id":"s1","label":"...","lane":"l2","kind":"decision","uses":[]}
{"op":"remove_step","map":"m_root","id":"s1"}
{"op":"connect","map":"m_root","from":"s1","to":"s2","label":"Yes"}
{"op":"disconnect","map":"m_root","from":"s1","to":"s2"}
{"op":"add_map","id":"m_s4","parent_map":"m_root","parent_step":"s4","title":"..."}
LAST LINE, always: {"op":"reply","say":"One short sentence on what you changed.","ask":"One specific follow-up question that fills the biggest gap (who, what triggers it, what tool, what happens when it goes wrong)."}

GUIDANCE
- Emit lanes before the steps that use them, and a step before connections to it. "after" connects from that earlier step; use "connect" for branches and loops.
- When the user says a step is made of parts, or names subprocesses, add a subprocess step, then add_map, then fill that child map with its own lanes (repeat lane names as needed) and steps.
- Change only what the new message implies. Fix the model when the user corrects you. Prefer the map the user is currently viewing unless they clearly mean another level.
- Labels: 2-5 words, verb first for tasks, a question for decisions.
- If the first message names the process, rename the process to a clear title.`;

function compactModel(p){
  const maps = {};
  for (const m of Object.values(p.maps)){
    maps[m.id] = { title:m.title, parent:m.parent, lanes:m.lanes.map(l=>[l.id,l.name,l.type]),
      steps:m.steps.map(s=>({ id:s.id, lane:s.lane, label:s.label, kind:s.kind, ...(s.uses?.length?{uses:s.uses}:{}), ...(s.next.length?{next:s.next.map(n=>n.label?[n.to,n.label]:n.to)}:{}), ...(s.child?{child:s.child}:{}) })) };
  }
  return JSON.stringify({ title:p.title, maps });
}
function buildPrompt(p, mapId, history, text){
  const m = p.maps[mapId];
  const convo = history.map(x => x.role === 'user' ? 'User: ' + x.content : 'You: ' + x.content + (x.ask ? ' ' + x.ask : '')).join('\n');
  return RULES +
    '\n\nCURRENT MODEL (lanes are [id,name,type]; next entries are a step id or [id,label]):\n' + compactModel(p) +
    '\n\nThe user is viewing map "' + mapId + '" (' + (m?.title || '') + ').' +
    (convo ? '\n\nCONVERSATION SO FAR:\n' + convo : '') +
    '\n\nNEW MESSAGE FROM USER:\n' + text + '\n\nReply now with JSON lines only.';
}

/* ---------- Talk to the mapper ---------- */
const ERR = {
  not_granted:'AI mapping needs your permission. Reload the page and allow it to use Claude.',
  sampling_disabled:'AI mapping is not available for this account.',
  rate_limited:'Too many requests right now. Wait a moment, then send again.',
  session_expired:'Your session expired. Sign in to Claude again.',
  refused:'That message could not be mapped. Try describing it differently.',
};
async function send(text){
  text = (text || '').trim();
  if (!text || S.busy) return;
  ensureOwned();
  const p = S.cur;
  if (!S.sample){ p.chat.push({ role:'note', content:'AI mapping is not available in this view. Open the page inside Claude to use it.' }); renderWork(); return; }
  const mapId = curMap().id;
  const history = p.chat.filter(x => x.role === 'user' || x.role === 'assistant').slice(-12);
  p.chat.push({ role:'user', content:text });
  const reply = { role:'assistant', content:'', pending:true, ops:0 };
  p.chat.push(reply);
  S.busy = true; $('#msg').value = ''; renderWork();
  const ctl = new AbortController(); S.ctl = ctl;
  let buf = '';
  const eat = raw => {
    const line = raw.trim().replace(/^```(?:json)?/, '').replace(/```$/, '').replace(/,$/, '').trim();
    if (!line.startsWith('{')) return;
    let o; try { o = JSON.parse(line); } catch { return; }
    if (o.op === 'reply'){ reply.content = String(o.say || ''); reply.ask = o.ask ? String(o.ask) : ''; }
    else if (applyOp(p, o, 'ai')) reply.ops++;
    queueRender();
  };
  try {
    await S.sample(buildPrompt(p, mapId, history, text), {
      cache:false, signal:ctl.signal, modelTier:S.deep ? 'default' : 'quick',
      onText: ({ delta }) => { const lines = (buf + delta).split('\n'); buf = lines.pop(); lines.forEach(eat); }
    });
    if (buf.trim()) eat(buf);
  } catch (e){
    if (buf.trim()) eat(buf);
    if (e?.code !== 'cancelled'){ reply.err = true; reply.content = ERR[e?.code] || 'The mapper was interrupted. Send your message again.'; }
    else if (!reply.content) reply.content = 'Stopped.';
  }
  reply.pending = false;
  if (!reply.content) reply.content = reply.ops ? 'Updated the map.' : 'I could not turn that into changes. Try describing who does what, in order.';
  S.busy = false; S.ctl = null;
  touch(); renderWork();
}

/* ---------- Saving ---------- */
let saveTimer = null, saving = false, dirty = false;
function setSave(t){ S.save = t; const el = $('#save'); if (el) el.textContent = t; }
function serialize(p){
  const st = stats(p);
  return { id:p.id, title:p.title, visibility:p.visibility, ownerId:p.ownerId || S.uid, updatedAt:p.updatedAt,
    stepCount:st.steps, depth:st.depth, laneTypes:st.lanes.map(l=>l.type).slice(0,8),
    maps:p.maps, chat:p.chat.filter(x=>!x.pending).slice(-40), events:(p.events||[]).slice(-300) };
}
function refFor(p){ return p.visibility === 'public' ? S.db.collection('public').doc(p.id) : S.db.collection('data/users/' + S.uid).doc(p.id); }
function touch(){ if (!S.cur || S.cur.example) return; S.cur.updatedAt = Date.now(); dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); setSave('Unsaved changes'); }
async function flush(){
  if (saving || !dirty) return;
  const p = S.cur; if (!p || p.example){ dirty = false; return; }
  dirty = false;
  if (!S.db || !S.uid){
    const i = S.local.findIndex(x => x.id === p.id); const d = serialize(p);
    if (i >= 0) S.local[i] = d; else S.local.unshift(d);
    setSave('Not saved — this view has no storage'); return;
  }
  saving = true; setSave('Saving…');
  try { await refFor(p).set(serialize(p)); setSave('Saved'); }
  catch (e){ setSave(e?.code === 'quota_exceeded' ? 'Storage is full — delete old processes' : e?.code === 'invalid_argument' ? 'You can view this process but not edit it' : 'Not saved — try again'); }
  saving = false;
  if (dirty) flush();
}
async function makePublic(){
  const p = S.cur; if (!p || p.visibility === 'public') return;
  ensureOwned();
  const q = S.cur; const wasPrivate = q.visibility === 'private';
  q.visibility = 'public'; q.updatedAt = Date.now();
  logEvent(q, { who:'human', op:'make_public' });
  q.chat.push({ role:'note', content:'Published to Public processes. Anyone with access can now view and improve it.' });
  S.confirmPublic = false;
  if (S.db && S.uid){
    try {
      await S.db.collection('public').doc(q.id).set(serialize(q));
      if (wasPrivate) await S.db.collection('data/users/' + S.uid).doc(q.id).delete().catch(()=>{});
      setSave('Saved');
    } catch { q.visibility = 'private'; q.chat.push({ role:'note', content:'Could not publish. You may not have permission to add public processes.' }); }
  }
  renderWork();
}

/* ---------- Layout ---------- */
const L = { HEAD:150, COL:196, BOXW:158, BOXH:60, ROWGAP:16, PADX:28, PADY:16, BAND:22 };
function layout(m){
  const ids = new Set(m.steps.map(s => s.id));
  const preds = {}; m.steps.forEach(s => preds[s.id] = []);
  m.steps.forEach(s => s.next.forEach(n => { if (ids.has(n.to)) preds[n.to].push(s.id); }));
  const col = {}, visiting = new Set();
  const depth = id => {
    if (id in col) return col[id]; if (visiting.has(id)) return -1;
    visiting.add(id); let d = 0;
    for (const p of preds[id]){ const pd = depth(p); if (pd >= 0) d = Math.max(d, pd + 1); }
    visiting.delete(id); col[id] = d; return d;
  };
  m.steps.forEach(s => depth(s.id));
  const laneIds = new Set(m.lanes.map(l => l.id));
  let lanes = [...m.lanes.filter(l => l.type !== 'system'), ...m.lanes.filter(l => l.type === 'system')];
  if (m.steps.some(s => !laneIds.has(s.lane))) lanes.push({ id:'__none', name:'Unassigned', type:'person' });
  const laneOf = s => laneIds.has(s.lane) ? s.lane : '__none';
  const slot = {}, rowOf = {}, rows = {};
  m.steps.forEach(s => { const k = laneOf(s) + '|' + col[s.id]; rowOf[s.id] = slot[k] = (slot[k] ?? -1) + 1; rows[laneOf(s)] = Math.max(rows[laneOf(s)] || 1, rowOf[s.id] + 1); });
  const maxCol = Math.max(0, ...Object.values(col));
  const width = L.HEAD + L.PADX * 2 + (maxCol + 1) * L.COL;
  const firstSys = lanes.findIndex(l => l.type === 'system');
  let y = 0; const laneY = {}, laneH = {}, bands = [];
  lanes.forEach((l, i) => {
    if (i === 0 && l.type !== 'system'){ bands.push({ y, t:'People' }); y += L.BAND; }
    if (i === firstSys){ bands.push({ y, t:'Technology' }); y += L.BAND; }
    laneY[l.id] = y; laneH[l.id] = (rows[l.id] || 1) * (L.BOXH + L.ROWGAP) + L.PADY * 2 - L.ROWGAP + 8; y += laneH[l.id];
  });
  const pos = {};
  m.steps.forEach(s => { pos[s.id] = { x:L.HEAD + L.PADX + col[s.id] * L.COL, y:laneY[laneOf(s)] + L.PADY + rowOf[s.id] * (L.BOXH + L.ROWGAP) }; });
  return { lanes, laneY, laneH, bands, pos, width, height:y };
}

}

function renderWork(fromStream){
  if (S.view !== 'work' || !S.cur) return;
  const p = S.cur;
  // validate path
  S.path = S.path.filter(id => p.maps[id]); if (!S.path.length) S.path = ['m_root'];
  const t = $('#title'); if (document.activeElement !== t) t.value = p.title;
  $('#vis').innerHTML = p.example ? '<span class="pill ex">Example</span>' : p.visibility === 'public' ? '<span class="pill pub">Public</span>' : '<span class="pill">Private</span>';
  $('#save').textContent = p.example ? 'Changes make a private copy' : S.save;
  $('#work').dataset.tab = S.tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#stop').hidden = !S.busy; $('#sendb').disabled = S.busy;
  renderMsgs(); renderCrumbs(); renderBoard(); renderInspector();
  if (S.fresh.size){ const f = S.fresh; setTimeout(() => { f.forEach(id => document.querySelector(`[data-step="${CSS.escape(id)}"]`)?.classList.remove('fresh')); }, 1700); S.fresh = new Set(); }
}

function renderMsgs(){
  const p = S.cur, el = $('#msgs');
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  if (!p.chat.length){
    el.innerHTML = `<div class="msg assistant">Tell me about a process: what it's called, who's involved, and what happens first. I'll build the map as you go and ask about anything that's missing.</div>
    <div class="starters"><div class="label">Or start with</div>${STARTERS.map(s => `<button class="starter" data-starter="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
    return;
  }
  el.innerHTML = p.chat.map(m => {
    if (m.role === 'note') return `<div class="msg note">${esc(m.content)}</div>`;
    if (m.role === 'user') return `<div class="msg user">${esc(m.content)}</div>`;
    if (m.pending && !m.content) return `<div class="msg assistant"><span class="thinking"><i></i><i></i><i></i>&nbsp;${m.ops ? 'Mapping · ' + m.ops + ' change' + (m.ops === 1 ? '' : 's') : 'Listening'}</span></div>`;
    return `<div class="msg assistant${m.err ? ' err' : ''}">${esc(m.content)}${m.ask ? `<span class="ask">${esc(m.ask)}</span>` : ''}${m.ops ? `<span class="ops">${m.ops} change${m.ops === 1 ? '' : 's'} to the map</span>` : ''}</div>`;
  }).join('');
  if (nearBottom || S.busy) el.scrollTop = el.scrollHeight;
}

function renderCrumbs(){
  const p = S.cur, ev = p.events || [];
  const ai = ev.filter(e => e.who === 'ai').length, hu = ev.filter(e => e.who === 'human').length;
  const totalDepth = stats(p).depth;
  const crumbs = S.path.map((id, i) => {
    const m = p.maps[id]; const last = i === S.path.length - 1;
    return (i ? '<span class="sep">/</span>' : '') + `<button class="crumb${last ? ' cur' : ''}" ${last ? 'aria-current="page"' : `data-depth="${i}"`}>${esc(i === 0 ? p.title : m.title)}</button>`;
  }).join('');
  const pub = p.visibility === 'public' ? '' : S.confirmPublic
    ? `<span class="hint">Anyone with access can view and edit.</span><button class="btn primary" data-pub="yes">Publish</button><button class="btn ghost" data-pub="no">Cancel</button>`
    : `<button class="btn" data-pub="ask">Make public</button>`;
  $('#crumbs').innerHTML = `${crumbs}
    <span class="depth" title="Layer ${S.path.length} of ${totalDepth}">${Array.from({length:Math.max(totalDepth,S.path.length)},(_,i)=>`<b class="${i < S.path.length ? 'on' : ''}"></b>`).join('')}</span>
    <span class="spacer"></span>
    <span class="signal" title="Every AI change and human correction is kept as learning signal">${ai} AI changes · ${hu} human edits</span>
    ${pub}`;
}

function renderBoard(){
  const m = curMap(), b = $('#board');
  if (!m.steps.length && !m.lanes.length){
    b.style.width = '100%'; b.style.height = '100%';
    b.innerHTML = `<div class="board-empty"><div><div class="label">${S.path.length > 1 ? 'Layer ' + S.path.length : 'Empty map'}</div><h3>${S.path.length > 1 ? 'Describe how “' + esc(m.title) + '” works' : 'Your map appears here'}</h3><span>People get their own lanes, technology gets its own lanes, and steps flow left to right. Say “this step has two parts” and it becomes a layer you can open.</span></div></div>`;
    return;
  }
  const g = layout(m);
  b.style.width = g.width + 'px'; b.style.height = g.height + 'px';
  let html = '';
  g.bands.forEach(bd => html += `<div class="band" style="top:${bd.y}px;width:${g.width}px">${bd.t}</div>`);
  g.lanes.forEach(l => html += `<div class="lane ${l.type}" style="top:${g.laneY[l.id]}px;height:${g.laneH[l.id]}px;width:${g.width}px"><div class="lane-head"><small>${l.type === 'system' ? 'Technology' : 'Person'}</small><b>${esc(l.name)}</b></div></div>`);
  // edges
  let paths = '', labels = '';
  const byId = Object.fromEntries(m.steps.map(s => [s.id, s]));
  m.steps.forEach(s => s.next.forEach((n, k) => {
    const a = g.pos[s.id], z = g.pos[n.to]; if (!a || !z || !byId[n.to]) return;
    const ay = a.y + L.BOXH / 2, zy = z.y + L.BOXH / 2;
    let d, lx, ly;
    if (z.x > a.x){
      const sx = a.x + L.BOXW, mid = sx + (z.x - sx) / 2 + (k ? 6 : 0);
      d = `M${sx},${ay} H${mid} V${zy} H${z.x - 2}`; lx = mid; ly = ay === zy ? ay - 10 : (ay + zy) / 2;
    } else if (z.x === a.x){
      const sx = a.x + L.BOXW / 2;
      d = z.y > a.y ? `M${sx},${a.y + L.BOXH} V${z.y - 2}` : `M${a.x + L.BOXW},${ay} h18 V${zy} H${z.x + L.BOXW + 2}`;
      lx = sx + 14; ly = (a.y + L.BOXH + z.y) / 2;
    } else {
      const low = Math.max(a.y, z.y) + L.BOXH + 10;
      d = `M${a.x + L.BOXW / 2},${a.y + L.BOXH} V${low} H${z.x + L.BOXW / 2} V${z.y + L.BOXH + 2}`; lx = (a.x + z.x + L.BOXW) / 2; ly = low;
    }
    paths += `<path d="${d}" marker-end="url(#arr)"/>`;
    if (n.label) labels += `<div class="elabel" style="left:${lx}px;top:${ly}px">${esc(n.label)}</div>`;
  }));
  html += `<svg class="edges" width="${g.width}" height="${g.height}" aria-hidden="true"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--edge);stroke:none"/></marker></defs>${paths}</svg>`;
  html += labels;
  const laneName = Object.fromEntries(m.lanes.map(l => [l.id, l.name]));
  m.steps.forEach(s => {
    const q = g.pos[s.id];
    const kids = s.child ? countSteps(S.cur, s.child) : 0;
    html += `<div class="step ${s.kind}${S.sel === s.id ? ' sel' : ''}${S.fresh.has(s.id) ? ' fresh' : ''}" data-step="${esc(s.id)}" role="button" tabindex="0" style="left:${q.x}px;top:${q.y}px">
      ${s.kind === 'decision' ? '<span class="k">◇ decision</span>' : s.kind === 'subprocess' ? '<span class="k">▤ subprocess</span>' : ''}
      <span>${esc(s.label)}</span>
      ${s.uses?.length ? `<span class="uses">${s.uses.filter(u => laneName[u]).map(u => `<span>${esc(laneName[u])}</span>`).join('')}</span>` : ''}
      ${s.kind === 'subprocess' ? `<button class="open" data-drill="${esc(s.id)}">${s.child ? 'Open · ' + kids + ' steps' : 'Open · empty'} ↘</button>` : ''}
    </div>`;
  });
  b.innerHTML = html;
}

function drill(stepId){
  const m = curMap(), s = m.steps.find(x => x.id === stepId); if (!s) return;
  if (!s.child){
    ensureOwned();
    const p = S.cur, mm = curMap(), ss2 = mm.steps.find(x => x.id === stepId);
    const id = 'm_' + ss2.id + '_' + Math.random().toString(36).slice(2,5);
    const lane = mm.lanes.find(l => l.id === ss2.lane);
    p.maps[id] = { id, title:ss2.label, parent:{ map:mm.id, step:ss2.id }, lanes:lane ? [{ id:rid('l'), name:lane.name, type:lane.type }] : [], steps:[] };
    ss2.kind = 'subprocess'; ss2.child = id;
    logEvent(p, { who:'human', op:'add_map', map:mm.id, id:ss2.id });
    touch(); S.path.push(id);
  } else S.path.push(s.child);
  S.sel = null; S.tab = 'map'; renderWork();
}
function onBoardClick(e){
  const d = e.target.closest('[data-drill]'); if (d){ e.stopPropagation(); drill(d.dataset.drill); return; }
  const st = e.target.closest('[data-step]');
  S.sel = st ? st.dataset.step : null; renderBoard(); renderInspector();
}
document.addEventListener('keydown', e => {
  const st = e.target.closest?.('[data-step]');
  if (st && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); S.sel = st.dataset.step; renderBoard(); renderInspector(); }
  if (e.key === 'Escape' && S.sel){ S.sel = null; renderBoard(); renderInspector(); }
});

const CORRECTIONS = [
  ['missing_after','Missing step after this', s => `There's a missing step after “${s.label}”: `],
  ['wrong_order','Wrong order', s => `“${s.label}” is in the wrong place. It should happen `],
  ['wrong_owner','Wrong person or system', s => `“${s.label}” is actually done by `],
  ['too_vague','Too vague', s => `“${s.label}” is too vague. What really happens is `],
  ['has_parts','This has parts', s => `“${s.label}” is really made of these subprocesses: `],
];
function renderInspector(){
  const box = $('#inspector'); const m = curMap(); const s = m.steps.find(x => x.id === S.sel);
  if (!s){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="inspector" role="dialog" aria-label="Step details">
    <div class="ins-head"><span class="label">Step · <span class="mono">${esc(s.id)}</span></span><button class="btn ghost" id="ix" aria-label="Close">✕</button></div>
    <div class="row"><label class="label" for="i-label">Name</label><input id="i-label" value="${esc(s.label)}"></div>
    <div class="row"><label class="label" for="i-lane">Lane</label><select id="i-lane">${m.lanes.map(l => `<option value="${esc(l.id)}" ${l.id === s.lane ? 'selected' : ''}>${esc(l.name)} (${l.type === 'system' ? 'technology' : 'person'})</option>`).join('')}${m.lanes.some(l=>l.id===s.lane)?'':'<option selected>Unassigned</option>'}</select></div>
    <div class="row"><label class="label" for="i-kind">Type</label><select id="i-kind">${KINDS.map(k => `<option ${k === s.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
    <div class="acts"><button class="btn primary" id="i-drill">${s.child ? 'Open subprocess ↘' : 'Break into a subprocess'}</button><button class="btn danger" id="i-del">Delete step</button></div>
    <div class="row"><span class="label">Did the AI get this wrong?</span>
      <div class="chips">${CORRECTIONS.map(c => `<button class="chip" data-corr="${c[0]}">${c[1]}</button>`).join('')}</div>
      <p class="hint">Corrections are logged as training signal, then you finish the sentence in the conversation.</p></div>
  </div>`;
  const edit = (field, val) => {
    ensureOwned(); const mm = curMap(), st = mm.steps.find(x => x.id === S.sel); if (!st) return;
    logEvent(S.cur, { who:'human', op:'edit_' + field, map:mm.id, id:st.id, before:st[field], after:val });
    st[field] = val; touch(); renderWork();
  };
  $('#ix').onclick = () => { S.sel = null; renderBoard(); renderInspector(); };
  $('#i-label').onchange = e => edit('label', e.target.value.trim() || s.label);
  $('#i-lane').onchange = e => edit('lane', e.target.value);
  $('#i-kind').onchange = e => edit('kind', e.target.value);
  $('#i-drill').onclick = () => drill(s.id);
  $('#i-del').onclick = () => { ensureOwned(); const mm = curMap(); applyOp(S.cur, { op:'remove_step', map:mm.id, id:S.sel }, 'human'); S.sel = null; touch(); renderWork(); };
  box.querySelectorAll('[data-corr]').forEach(b => b.onclick = () => {
    const c = CORRECTIONS.find(x => x[0] === b.dataset.corr);
    ensureOwned(); logEvent(S.cur, { who:'human', op:'correction', type:c[0], map:curMap().id, id:s.id });
    touch(); S.tab = 'chat'; renderWork();
    const msg = $('#msg'); msg.value = c[2](s); msg.focus(); msg.setSelectionRange(msg.value.length, msg.value.length);
  });
}

/* ---------- Boot ---------- */
S.view = ss.get('ps_in') ? 'home' : 'login';
render();
(async () => {
  const c = window.claude;
  if (!c){ S.ready = true; render(); return; }
  const [user, db, sample] = await Promise.all([c.use('user'), c.use('db'), c.use('sample')]);
  S.sample = sample; S.ready = true;
  if (user){ try { const me = await user.me(); S.uid = me?.id || await user.id(); S.name = me?.name || ''; } catch {} }
  if (db && S.uid){
    S.db = db;
    db.collection('data/users/' + S.uid).orderBy('updatedAt','desc').limit(100).onSnapshot(snap => {
      S.mine = snap.docs.map(d => d.data()); if (S.view === 'home') render();
    }, () => {});
    db.collection('public').orderBy('updatedAt','desc').limit(100).onSnapshot(snap => {
      S.pub = snap.docs.map(d => d.data()); if (S.view === 'home') render();
    }, () => {});
  }
  if (S.view !== 'work') render();
})();
</script>
